<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>coding club 02</title>
    <link rel="stylesheet" href="codingclub2.css">

</head>
<body>
    <div class="maincontainer">
        <div class="box1">
            <h1>Coding Club</h1>
            <p>Learn. Built. Share</p>
        </div >
        <h2>Upcoming Event</h2>
        <div class="box2">
            <table>
                <thead>
                    <tr>
                        <th>Event</th>
                        <th>Date</th>
                        <th>Venue</th>
                    </tr>
                </thead>
                
                <tbody>
                    <tr>
                        <td>HTML Workshop</td>
                        <td>12Nov</td>
                        <td>Lab1</td>
                    </tr>
                    <tr>
                        <td>Hackathon</td>
                        <td>20Nov</td>
                        <td>Seminar Hall</td>
                    </tr>
                </tbody>
                

            </table>

        </div>
        <div class="box3">
            <h2>Register</h2>
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Your Name">

            <br><br>

            <label for="email">Email address</label>
            <input type="email" id="email" placeholder="you000@gmail.com">

            <br><br>

            <button>
                Register
            </button>
        </div>
    </div>
    
</body>
</html>
